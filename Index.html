<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europe Job Search | Truck Drivers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gold-glow { box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); border: 1px solid #ffd700; }
        .hero-bg { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1519003722824-194d4455a60c?auto=format&fit=crop&q=80'); background-size: cover; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white font-sans">
    <nav class="p-5 flex justify-between items-center border-b border-gray-800">
        <h1 class="text-2xl font-bold text-[#ffd700]">Europe Job Search</h1>
        <div class="space-x-4">
            <a href="#" class="hover:text-[#ffd700]">Home</a>
            <a href="#" class="hover:text-[#ffd700]">Countries</a>
            <a href="#" class="bg-[#ff8c00] px-4 py-2 rounded text-black font-bold">Contact</a>
        </div>
    </nav>

    <header class="hero-bg h-[400px] flex flex-col justify-center items-center text-center p-10">
        <h2 class="text-4xl font-bold mb-4 text-[#ffd700]">Your Journey, Our Mission: Elite Trucking Careers</h2>
        <p class="mb-6 text-gray-300">Exclusive Opportunities for Professional Truck Drivers</p>
        <div class="flex bg-white/10 backdrop-blur-md p-2 rounded-lg gold-glow">
            <input type="text" placeholder="License Category (C+E, ADR)..." class="bg-transparent p-2 outline-none w-64">
            <button class="bg-[#ff8c00] px-6 py-2 rounded font-bold text-black">Search</button>
        </div>
    </header>

    <main class="p-10">
        <h3 class="text-3xl font-bold mb-8 text-center">Exclusive Driving Routes</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="bg-[#1a1a1a] p-5 rounded-xl gold-glow text-center">
                <img src="https://flagcdn.com/w160/pl.png" class="w-16 mx-auto mb-4" alt="Poland">
                <h4 class="text-2xl font-bold">Poland</h4>
                <p class="text-gray-400 mt-2">Specialized Routes Available</p>
            </div>
            <div class="bg-[#1a1a1a] p-5 rounded-xl gold-glow text-center border-orange-500">
                <img src="https://flagcdn.com/w160/hu.png" class="w-16 mx-auto mb-4" alt="Hungary">
                <h4 class="text-2xl font-bold text-orange-400">Hungary</h4>
                <p class="text-gray-300 mt-2">High Demand for Trailers</p>
            </div>
            <div class="bg-[#1a1a1a] p-5 rounded-xl gold-glow text-center">
                <img src="https://flagcdn.com/w160/ro.png" class="w-16 mx-auto mb-4" alt="Romania">
                <h4 class="text-2xl font-bold">Romania</h4>
                <p class="text-gray-400 mt-2">New Career Paths</p>
            </div>
        </div>
    </main>
</body>
</html>
